<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Högfelts träning</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111e;color:#f2f7ff;font:16px system-ui}main{max-width:650px;margin:auto;padding:20px 16px 100px}h1{font-size:27px}h2{font-size:22px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #385470;background:#19324c;color:white;border-radius:12px;padding:12px}input,select{background:#091a2c;color:white;border:1px solid #37516c;padding:12px;border-radius:10px;width:100%}label{display:grid;gap:5px;margin:12px 0;color:#c6d8ed}.card{background:linear-gradient(135deg,#11263c,#0b192a);border:1px solid #2a425b;border-radius:22px;padding:19px;margin:16px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:105px;text-align:left;font-weight:bold;font-size:18px;border-radius:17px}.tile small{display:block;font-size:12px;font-weight:normal;margin-top:9px}.gray{background:#304359}.pink{background:#ce3d84}.blue,.primary{background:#237fe4}.orange{background:#dd752b}.purple{background:#8753c4}.teal{background:#11999a}.green{background:#1caa58}.next{outline:3px solid #78c1ff}.muted{color:#afc4d9}.stack{display:grid;gap:10px}.item{padding:14px;background:#142b43;border-radius:13px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{flex:1}.wide{width:100%}.danger{background:#733342}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;background:#081523ed;padding:12px}.tabs button{border:0;background:none}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{background:#152e48;border-radius:9px;text-align:center;padding:8px 2px;font-size:12px}.day b{display:block;font-size:21px}.day button{padding:6px;margin-top:5px;width:31px}.hidden{display:none}.small{font-size:13px}.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(65px,1fr));gap:8px}.selected{outline:2px solid #71c0ff}.back{background:transparent;border:0;color:#8ccaff}
</style><main><h1>🏋️ Högfelts träning</h1><div id="app"></div></main><nav class="tabs"><button onclick="go('home')">⌂ Start</button><button onclick="go('history')">▤ Historik</button><button onclick="go('settings')">⚙ Inställningar</button></nav><script>
const KEY='hogfelts-prototype-v01',id=()=>Math.random().toString(36).slice(2),today=()=>new Date().toLocaleDateString('sv-SE'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),start=s=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return d.toLocaleDateString('sv-SE')},shift=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')};
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){console.warn('Lagring ej tillgänglig',e)}db||={plans:[],active:null,logs:[],skips:[],points:{},showRun:true,showPoints:true,runs:[],offset:0,draft:null};let view='home',plan=null,pass=null,session=null,step=0;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('Lokal lagring blockerad',e)}},active=()=>db.plans.find(p=>p.id===db.active),week=()=>shift(start(today()),db.offset*7),weekLogs=(p,w)=>db.logs.filter(l=>l.planId===p.id&&start(l.date)===w),skipped=(p,w,x)=>db.skips.some(s=>s.planId===p.id&&s.week===w&&s.passId===x);
function next(p,w){let events=[...db.logs.filter(l=>l.planId===p.id).map(l=>({date:l.date,passId:l.passId})),...db.skips.filter(s=>s.planId===p.id).map(s=>({date:s.week,passId:s.passId}))].filter(e=>p.rotation==='weekly'?start(e.date)===w:e.date<=shift(w,6)).sort((a,b)=>a.date.localeCompare(b.date));let i=0;for(let e of events)if(e.passId===p.passes[i]?.id)i=(i+1)%p.passes.length;return p.passes[i]?.id}
function go(v){view=v;render();scrollTo(0,0)}function render(){document.getElementById('app').innerHTML=({home,plans,editPlan,editPass,workout,history,settings,run}[view]||home)()}
function home(){let p=active(),w=week();return `<div class="card"><div class="row"><h2>💪 Styrketräning</h2><div class="buttons"><button onclick="db.offset--;save();render()">‹</button><span>V.${weekNo(w)}</span><button onclick="db.offset++;save();render()">›</button></div></div>${p?`<p class="muted">Aktiv plan: ${esc(p.name)}</p><div class="grid">${p.passes.map((x,i)=>{let l=weekLogs(p,w).filter(y=>y.passId===x.id),skip=skipped(p,w,x.id);return `<button class="tile ${l.length?'green':x.color} ${next(p,w)===x.id&&!l.length?'next':''}" onclick="openPass('${x.id}')">${i+1}. ${esc(x.name)}<small>${l.length?'✓ '+l.map(y=>y.date.slice(5)).join(', '):skip?'⏭ Överhoppat':next(p,w)===x.id?'⭐ Nästa pass':'Öppna'}</small></button>`}).join('')}</div><p><button class="back" onclick="go('plans')">📁 Visa / byt träningsplan →</button></p>`:`<p>Ingen träningsplan ännu.</p><button class="primary wide" onclick="newPlan()">+ Skapa träningsplan</button>`}</div>${db.showRun?`<div class="card"><h2>🏃 Löpning</h2><button class="primary wide" onclick="go('run')">+ Registrera löppass</button>${db.runs.length?`<p class="muted">Senaste: ${esc(db.runs.at(-1).distance)} km · ${esc(db.runs.at(-1).time)}</p>`:''}</div>`:''}${db.showPoints?`<div class="card"><h2>🍫 Högfelt Points</h2><div class="days">${['Mån','Tis','Ons','Tor','Fre','Lör','Sön'].map((x,i)=>{let d=shift(w,i);return `<div class="day">${x}<b>${db.points[d]||0}</b><button onclick="points('${d}',-1)">−</button><button onclick="points('${d}',1)">+</button></div>`}).join('')}</div><p style="text-align:right">${Array.from({length:7},(_,i)=>db.points[shift(w,i)]||0).reduce((a,b)=>a+b,0)} av 10 p</p></div>`:''}`}
function weekNo(s){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+3);let y=new Date(d.getFullYear(),0,1);return Math.ceil((((d-y)/86400000)+1)/7)}function points(d,n){db.points[d]=Math.max(0,(db.points[d]||0)+n);save();render()}
function plans(){return `<div class="card"><h2>Mina träningsplaner</h2><button class="primary wide" onclick="newPlan()">+ Ny träningsplan</button><div class="stack" style="margin-top:16px">${db.plans.map(p=>`<div class="item"><b>${esc(p.name)}</b> <span class="muted small">${p.id===db.active?'✓ Aktiv':''}</span><p class="muted small">${p.passes.length} pass · ${p.rotation==='weekly'?'Veckovis':'Löpande'}</p><div class="buttons"><button onclick="db.active='${p.id}';save();go('home')">Aktivera</button><button onclick="plan=structuredClone(db.plans.find(x=>x.id==='${p.id}'));go('editPlan')">Ändra</button><button onclick="copyPlan('${p.id}')">Kopiera</button><button class="danger" onclick="deletePlan('${p.id}')">Radera</button></div></div>`).join('')}</div></div>`}
function newPlan(){plan={id:id(),name:'Ny träningsplan',rotation:'continuous',passes:[]};go('editPlan')}function copyPlan(pid){let p=structuredClone(db.plans.find(x=>x.id===pid));p.id=id();p.name+=' (kopia)';p.passes.forEach(x=>{x.id=id();x.exercises.forEach(e=>e.id=id())});db.plans.push(p);save();render()}function deletePlan(pid){if(!confirm('Radera plan och tillhörande historik permanent?'))return;db.plans=db.plans.filter(x=>x.id!==pid);db.logs=db.logs.filter(x=>x.planId!==pid);db.skips=db.skips.filter(x=>x.planId!==pid);if(db.active===pid)db.active=db.plans[0]?.id||null;save();render()}
function editPlan(){return `<div class="card"><h2>Redigera träningsplan</h2><label>Plannamn<input value="${esc(plan.name)}" oninput="plan.name=this.value"></label><label>Rotation<select onchange="plan.rotation=this.value"><option value="continuous" ${plan.rotation==='continuous'?'selected':''}>Löpande</option><option value="weekly" ${plan.rotation==='weekly'?'selected':''}>Börja om varje måndag</option></select></label><h3>Pass</h3><div class="stack">${plan.passes.map((x,i)=>`<div class="item row"><div>${i+1}. <b>${esc(x.name)}</b><div class="muted small">${x.exercises.length} övningar</div></div><button onclick="pass=structuredClone(plan.passes[${i}]);pass.index=${i};go('editPass')">Ändra</button></div>`).join('')}</div><div class="buttons" style="margin-top:14px"><button onclick="pass={id:id(),name:'Nytt pass',color:'gray',exercises:[],index:-1};go('editPass')">+ Pass</button><button class="primary" onclick="savePlan()">Spara plan</button></div></div>`}
function savePlan(){if(!plan.name.trim()||!plan.passes.length)return alert('Ange namn och minst ett pass');let i=db.plans.findIndex(x=>x.id===plan.id);if(i<0)db.plans.push(plan);else db.plans[i]=plan;if(!db.active)db.active=plan.id;save();go('home')}
function editPass(){return `<div class="card"><h2>Redigera pass</h2><label>Namn<input value="${esc(pass.name)}" oninput="pass.name=this.value"></label><label>Knappfärg<select onchange="pass.color=this.value">${['gray','pink','blue','orange','purple','teal'].map((c,i)=>`<option value="${c}" ${pass.color===c?'selected':''}>${['Grå','Rosa','Blå','Orange','Lila','Turkos'][i]}</option>`).join('')}</select></label><h3>Övningar</h3><div class="stack">${pass.exercises.map((e,i)=>`<div class="item"><div class="row"><b>Övning ${i+1}</b><button onclick="pass.exercises.splice(${i},1);render()">Ta bort</button></div><label>Namn<input value="${esc(e.name)}" oninput="pass.exercises[${i}].name=this.value"></label><label>Typ<select onchange="pass.exercises[${i}].type=this.value;render()"><option value="reps" ${e.type==='reps'?'selected':''}>Vikt och reps</option><option value="time" ${e.type==='time'?'selected':''}>Tid</option><option value="check" ${e.type==='check'?'selected':''}>Endast avprickning</option></select></label>${e.type!=='check'?`<label>Set<input type="number" min="1" value="${e.sets}" oninput="pass.exercises[${i}].sets=+this.value"></label><label>Mål per set<input type="number" min="1" value="${e.target}" oninput="pass.exercises[${i}].target=+this.value"></label>`:''}</div>`).join('')}</div><div class="buttons" style="margin-top:14px"><button onclick="pass.exercises.push({id:id(),name:'Ny övning',type:'reps',sets:3,target:8});render()">+ Övning</button><button class="primary" onclick="savePass()">Spara pass</button></div></div>`}
function savePass(){if(!pass.name.trim())return alert('Ange passnamn');if(pass.index<0)plan.passes.push(pass);else plan.passes[pass.index]=pass;delete pass.index;go('editPlan')}
function openPass(pid){let p=active(),x=p.passes.find(y=>y.id===pid),w=week();let choice=prompt(`${x.name}\n1 = Genomför pass\n2 = Hoppa över pass denna vecka\n3 = Ångra överhoppning`,'1');if(choice==='2'){if(!skipped(p,w,pid))db.skips.push({planId:p.id,passId:pid,week:w});save();render();return}if(choice==='3'){db.skips=db.skips.filter(s=>!(s.planId===p.id&&s.passId===pid&&s.week===w));save();render();return}if(choice!=='1')return;if(db.draft&&db.draft.passId===pid&&db.draft.planId===p.id&&confirm('Återuppta pågående pass?'))session=db.draft;else session={id:id(),planId:p.id,passId:pid,passName:x.name,date:today(),exercises:structuredClone(x.exercises).map(e=>({...e,weight:'',values:Array(e.sets||1).fill(''),progress:'',done:false}))};step=Math.max(0,session.exercises.findIndex(e=>!e.done));db.draft=session;save();go('workout')}
function previous(e){return db.logs.filter(l=>l.planId===session.planId&&l.date<=session.date).flatMap(l=>l.exercises).reverse().find(x=>x.name.toLowerCase()===e.name.toLowerCase()&&x.type===e.type)}function workout(){let e=session.exercises[step],prev=e?previous(e):null;return `<div class="card"><div class="row"><button class="back" onclick="db.draft=session;save();go('home')">‹ Tillbaka</button><b>${esc(session.passName)}</b><span>${step+1}/${session.exercises.length}</span></div><label>Dagens passnamn<input value="${esc(session.passName)}" oninput="session.passName=this.value;draft()"></label><label>Datum<input type="date" value="${session.date}" onchange="session.date=this.value;draft()"></label>${e?`<h2>${esc(e.name)}</h2><p class="muted">${e.type==='check'?'Endast avprickning':`${e.sets} × ${e.target} ${e.type==='time'?'sekunder':'repetitioner'}`}</p><div class="item small">${prev?`Förra gången: ${esc(prev.weight||'')} ${prev.weight?'kg · ':''}${esc(prev.values.join(' / '))} ${esc(prev.progress||'')}`:'Inget tidigare resultat'}</div>${e.type==='reps'?`<label>Vikt (kg)<input type="number" step="0.5" value="${esc(e.weight||prev?.weight||'')}" onchange="session.exercises[step].weight=this.value;draft()"></label>`:''}${e.type!=='check'?`<h3>${e.type==='time'?'Sekunder':'Repetitioner'}</h3><div class="sets">${Array.from({length:e.sets},(_,i)=>`<label>Set ${i+1}<input type="number" min="0" placeholder="–" value="${esc(e.values[i])}" onchange="session.exercises[step].values[${i}]=this.value;draft()"></label>`).join('')}</div><h3>Progression nästa gång</h3><div class="buttons">${['↑','→','↓'].map(x=>`<button class="${e.progress===x?'selected':''}" onclick="session.exercises[step].progress='${x}';draft();render()">${x}</button>`).join('')}</div>`:''}<div class="buttons" style="margin-top:20px"><button onclick="step=Math.max(0,step-1);render()" ${step===0?'disabled':''}>‹ Föregående</button><button class="primary" onclick="complete()">✓ Klar – nästa</button></div>`:'<p>Inga övningar i passet.</p>'}<p class="muted small">${session.exercises.map((x,i)=>x.done?'🟢':i===step?'🔵':'⚪').join(' ')}</p>${session.exercises.length&&session.exercises.every(x=>x.done)?`<button class="primary wide" onclick="finish()">✓ Spara och avsluta</button>`:''}</div>`}
function draft(){db.draft=session;save()}function complete(){let e=session.exercises[step];if(e.type!=='check'&&(!e.values.every(x=>x!==''&&+x>=0)||!e.progress))return alert('Fyll i set och välj progression');if(e.type==='reps'){let v=document.querySelector('input[step="0.5"]');e.weight=v?.value||e.weight||previous(e)?.weight||'';if(e.weight==='')return alert('Ange vikt')}e.done=true;draft();if(step<session.exercises.length-1)step++;render()}function finish(){if(!session.exercises.every(e=>e.done))return;db.logs.push(structuredClone(session));db.draft=null;session=null;save();go('home')}
function history(){return `<div class="card"><h2>Träningshistorik</h2><div class="stack">${[...db.logs].sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<div class="item"><div class="row"><div><b>${esc(l.passName)}</b><p class="muted small">${l.date}</p></div><button onclick="document.getElementById('d${l.id}').classList.toggle('hidden')">Visa</button></div><div id="d${l.id}" class="hidden">${l.exercises.map(e=>`<p>${esc(e.name)}: ${e.type==='check'?'✓':`${esc(e.weight)} kg · ${esc(e.values.join('/'))} ${esc(e.progress)}`}</p>`).join('')}<button class="danger" onclick="if(confirm('Radera?')){db.logs=db.logs.filter(x=>x.id!=='${l.id}');save();render()}">Radera registrering</button></div></div>`).join('')||'<p class="muted">Inga genomförda pass ännu.</p>'}</div></div>`}
function run(){return `<div class="card"><h2>🏃 Löpning</h2><form onsubmit="addRun(event)"><label>Datum<input type="date" name="date" value="${today()}" required></label><label>Distans (km)<input type="number" step="0.01" min="0.01" name="distance" required></label><label>Tid (mm:ss)<input name="time" pattern="[0-9]+:[0-5][0-9]" placeholder="31:24" required></label><label>Typ<select name="where"><option>Utomhus</option><option>Löpband</option></select></label><button class="primary wide">Spara löppass</button></form><h3>Senaste pass</h3>${[...db.runs].reverse().map(r=>`<div class="item">${esc(r.date)} · ${esc(r.distance)} km · ${esc(r.time)} · ${esc(r.where)}</div>`).join('')}</div>`}function addRun(e){e.preventDefault();db.runs.push(Object.fromEntries(new FormData(e.target)));save();go('home')}
function settings(){return `<div class="card"><h2>⚙ Inställningar</h2><button class="wide" onclick="go('plans')">Hantera träningsplaner →</button><label>Visa löpning <input type="checkbox" ${db.showRun?'checked':''} onchange="db.showRun=this.checked;save()" style="width:auto"></label><label>Visa Högfelt Points <input type="checkbox" ${db.showPoints?'checked':''} onchange="db.showPoints=this.checked;save()" style="width:auto"></label><button class="wide" onclick="backup()">⬇ Exportera säkerhetskopia</button><label>Importera säkerhetskopia<input type="file" accept="application/json" onchange="restore(this.files[0])"></label><p class="muted small">Prototyp 0.1. All data sparas lokalt på den här enheten.</p></div>`}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hogfelts-traning-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.plans)||!Array.isArray(d.logs))throw Error('Fel format');if(!confirm('Ersätt befintlig data?'))return;db=d;save();go('home')}catch{alert('Ogiltig säkerhetskopia')}}try{render()}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="card"><h2>Prototypen kunde inte starta</h2><p>Öppna filen i Safari eller på en webbserver. Fel: '+esc(e.message)+'</p></div>'}
</script></html>
